[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.poetry]
package-mode = false

[project]
name = "gem-strategy-backtester"
version = "0.2.0"
description = "Interactive platform for researching and backtesting quantitative trading strategies."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "streamlit>=1.50",
    "plotly>=5.20",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
test = [
    "pytest>=9.2.0",
]
lint = [
    "ruff>=0.6.0",
]
dev = [
    "ipykernel",
    "nbformat>=4.2.0",
    "ipywidgets",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["assets", "data", "periods"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["backtest*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"app/app.py" = ["E402"]
